<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Brawler EX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #0d0d13;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 900px;
            height: 450px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
            border: 2px solid #222;
        }
        canvas { background: #12131C; display: block; }
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .top-hud { display: flex; justify-content: space-between; width: 100%; }
        .stat-box { width: 38%; }
        .bar-wrap {
            width: 100%; height: 16px;
            background: #222; border: 2px solid #444;
            border-radius: 8px; overflow: hidden;
        }
        .bar-fill { height: 100%; width: 100%; transition: width 0.1s linear; }
        .p1-fill { background: linear-gradient(90deg, #00e5ff, #0088ff); }
        .boss-fill { background: linear-gradient(90deg, #ff0055, #ff5500); }
        .wave-text { font-size: 20px; font-weight: bold; color: #ffeb3b; text-align: center; }
        #combo-counter {
            position: absolute; left: 30px; top: 80px;
            font-size: 28px; font-weight: 900; color: #00e5ff;
            font-style: italic; opacity: 0; transition: opacity 0.2s;
        }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.85);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: auto;
        }
        #overlay h1 { font-size: 52px; color: #00e5ff; text-shadow: 0 0 15px #00e5ff; }
        #overlay p { font-size: 16px; color: #aaa; margin: 10px 0 20px; }
        button {
            padding: 12px 35px; font-size: 18px; font-weight: bold;
            background: #00e5ff; color: #000; border: none; border-radius: 4px;
            cursor: pointer; box-shadow: 0 0 15px rgba(0,229,255,0.5);
            transition: all 0.2s;
        }
        button:hover { background: #fff; transform: scale(1.05); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="450"></canvas>
    
    <div class="ui-layer">
        <div class="top-hud">
            <div class="stat-box">
                <div style="color:#00e5ff; font-weight:bold; margin-bottom:3px;">HERO</div>
                <div class="bar-wrap"><div id="p1-hp" class="bar-fill p1-fill"></div></div>
            </div>
            <div class="wave-text" id="wave-display">WAVE 1</div>
            <div class="stat-box">
                <div id="enemy-label" style="color:#ff0055; font-weight:bold; margin-bottom:3px; text-align:right;">FOES</div>
                <div class="bar-wrap"><div id="boss-hp" class="bar-fill boss-fill"></div></div>
            </div>
        </div>
        <div id="combo-counter">0 COMBO!</div>
    </div>

    <div id="overlay">
        <h1 id="title">STICKMAN: ARENA EX</h1>
        <p id="subtitle">Defeat waves of minions and face the Giant Warlord!</p>
        <button id="start-btn" onclick="startGame()">START BRAWL</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.6;
const GROUND_Y = 370;

let screenShake = 0;
let particles = [];
let keys = {};
let gameRunning = false;
let wave = 1;
let combo = 0;
let comboTimer = 0;

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

class Particle {
    constructor(x, y, vx, vy, color, size, life) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.size = size; this.life = life; this.maxLife = life;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.life--;
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1;
    }
}

function createHitSparks(x, y, color) {
    screenShake = 6;
    for (let i = 0; i < 12; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 6 + 2;
        particles.push(new Particle(x, y, Math.cos(angle)*speed, Math.sin(angle)*speed, color, Math.random()*4+2, 15));
    }
}

class Fighter {
    constructor(x, color, isNPC = false, scale = 1) {
        this.x = x; this.y = GROUND_Y;
        this.vx = 0; this.vy = 0;
        this.color = color;
        this.scale = scale;
        this.isNPC = isNPC;
        
        this.hp = 100 * scale;
        this.maxHp = 100 * scale;
        
        this.isGrounded = true;
        this.facingRight = true;
        this.state = 'idle'; // idle, moving, punch, kick, block, hit
        this.stateTimer = 0;
        
        // Procedural Animation Cycle
        this.walkCycle = 0;
        this.comboStep = 0;
        this.type = 'minion'; // minion, brute, boss
    }

    update(target) {
        if (this.stateTimer > 0) {
            this.stateTimer--;
            if (this.stateTimer === 0) this.state = 'idle';
        }

        if (this.isNPC) {
            this.updateAI(target);
        } else {
            this.updatePlayerControls(target);
        }

        // Physics
        this.x += this.vx;
        this.vy += GRAVITY;
        this.y += this.vy;

        if (this.y >= GROUND_Y) {
            this.y = GROUND_Y;
            this.vy = 0;
            this.isGrounded = true;
        }

        this.x = Math.max(30, Math.min(canvas.width - 30, this.x));

        // Procedural Walk Gait Update
        if (Math.abs(this.vx) > 0.5 && this.isGrounded) {
            this.walkCycle += 0.25;
        } else {
            this.walkCycle = 0;
        }
    }

    updatePlayerControls(target) {
        if (['idle', 'moving'].includes(this.state)) {
            this.vx = 0;
            this.state = 'idle';

            if (keys['a']) { this.vx = -4.5; this.state = 'moving'; this.facingRight = false; }
            if (keys['d']) { this.vx = 4.5; this.state = 'moving'; this.facingRight = true; }
            if ((keys['w'] || keys[' ']) && this.isGrounded) { this.vy = -12; this.isGrounded = false; }

            if (keys['j']) {
                this.executeAttack(target, 'punch', 10 + this.comboStep * 5, 45, 12);
                this.comboStep = (this.comboStep + 1) % 3;
            } else if (keys['k']) {
                this.executeAttack(target, 'kick', 20, 55, 18);
            } else if (keys['l']) {
                this.state = 'block';
            }
        }
    }

    updateAI(target) {
        if (!target || this.hp <= 0) return;
        let dist = target.x - this.x;
        this.facingRight = dist > 0;

        if (['idle', 'moving'].includes(this.state)) {
            let absDist = Math.abs(dist);
            let attackRange = this.type === 'boss' ? 70 : 40;

            if (absDist > attackRange) {
                let speed = this.type === 'boss' ? 2 : (this.type === 'brute' ? 1.5 : 2.5);
                this.vx = this.facingRight ? speed : -speed;
                this.state = 'moving';
            } else {
                this.vx = 0;
                this.state = 'idle';
                if (Math.random() < (this.type === 'boss' ? 0.05 : 0.03)) {
                    let atk = Math.random() > 0.4 ? 'punch' : 'kick';
                    let dmg = this.type === 'boss' ? 25 : 8;
                    this.executeAttack(target, atk, dmg, attackRange + 10, 20);
                }
            }
        }
    }

    executeAttack(target, type, damage, range, lockFrames) {
        this.state = type;
        this.stateTimer = lockFrames;
        
        let dir = this.facingRight ? 1 : -1;
        let reach = this.x + (dir * (range * this.scale));
        
        if (target && Math.abs(reach - target.x) < (range * this.scale) && Math.abs(this.y - target.y) < 50) {
            target.takeDamage(damage, dir * (8 * this.scale));
            createHitSparks(target.x, target.y - (30 * this.scale), this.color);
            if (!this.isNPC) {
                combo++;
                comboTimer = 120;
            }
        }
    }

    takeDamage(dmg, knockback) {
        if (this.state === 'block') {
            dmg *= 0.15;
            knockback *= 0.2;
        } else {
            this.state = 'hit';
            this.stateTimer = 12;
        }
        this.hp = Math.max(0, this.hp - dmg);
        this.vx += knockback;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);

        let dir = this.facingRight ? 1 : -1;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let legAngle1 = Math.sin(this.walkCycle) * 0.6;
        let legAngle2 = -Math.sin(this.walkCycle) * 0.6;

        let headY = -65, neckY = -50, hipY = -25;
        
        // Head
        ctx.beginPath();
        ctx.arc(0, headY, 8, 0, Math.PI * 2);
        ctx.stroke();

        // Body
        ctx.beginPath();
        ctx.moveTo(0, neckY);
        ctx.lineTo(0, hipY);
        ctx.stroke();

        // Poses based on State
        let arm1 = {x: 12 * dir, y: neckY + 10}, arm2 = {x: -10 * dir, y: neckY + 10};
        let leg1 = {x: Math.sin(legAngle1) * 15, y: 0}, leg2 = {x: Math.sin(legAngle2) * 15, y: 0};

        if (this.state === 'punch') {
            arm1 = {x: 28 * dir, y: neckY + 2};
        } else if (this.state === 'kick') {
            leg1 = {x: 30 * dir, y: hipY + 5};
        } else if (this.state === 'block') {
            arm1 = {x: 8 * dir, y: neckY - 5};
            arm2 = {x: 10 * dir, y: neckY + 2};
        } else if (this.state === 'hit') {
            ctx.rotate(-0.2 * dir);
        }

        // Draw Arms
        ctx.beginPath();
        ctx.moveTo(0, neckY + 2); ctx.lineTo(arm1.x, arm1.y);
        ctx.moveTo(0, neckY + 2); ctx.lineTo(arm2.x, arm2.y);
        ctx.stroke();

        // Draw Legs
        ctx.beginPath();
        ctx.moveTo(0, hipY); ctx.lineTo(leg1.x, leg1.y);
        ctx.moveTo(0, hipY); ctx.lineTo(leg2.x, leg2.y);
        ctx.stroke();

        ctx.restore();
    }
}

let player;
let enemies = [];

function spawnWave() {
    enemies = [];
    let waveLabel = document.getElementById('wave-display');
    let enemyLabel = document.getElementById('enemy-label');

    if (wave === 1) {
        waveLabel.innerText = "WAVE 1: FOOTSOLDERS";
        enemyLabel.innerText = "MINIONS";
        enemies.push(new Fighter(650, '#ff0055', true, 1));
        enemies.push(new Fighter(780, '#ff0055', true, 1));
    } else if (wave === 2) {
        waveLabel.innerText = "WAVE 2: HEAVY BRUTES";
        enemyLabel.innerText = "BRUTES";
        let b1 = new Fighter(700, '#ffaa00', true, 1.3);
        b1.type = 'brute';
        enemies.push(b1);
    } else if (wave === 3) {
        waveLabel.innerText = "BOSS WAVE: WARLORD";
        enemyLabel.innerText = "WARLORD BOSS";
        let boss = new Fighter(750, '#ff0000', true, 2.2);
        boss.type = 'boss';
        enemies.push(boss);
    }
}

function startGame() {
    document.getElementById('overlay').style.display = 'none';
    player = new Fighter(150, '#00e5ff', false, 1.05);
    wave = 1;
    combo = 0;
    spawnWave();
    gameRunning = true;
    requestAnimationFrame(gameLoop);
}

function updateHUD() {
    document.getElementById('p1-hp').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    
    let activeEnemy = enemies[0];
    if (activeEnemy) {
        document.getElementById('boss-hp').style.width = `${Math.max(0, (activeEnemy.hp / activeEnemy.maxHp) * 100)}%`;
    } else {
        document.getElementById('boss-hp').style.width = '0%';
    }

    let comboEl = document.getElementById('combo-counter');
    if (comboTimer > 0) {
        comboTimer--;
        comboEl.style.opacity = '1';
        comboEl.innerText = `${combo} HIT COMBO!`;
    } else {
        combo = 0;
        comboEl.style.opacity = '0';
    }
}

function gameLoop() {
    if (!gameRunning) return;

    // Apply Screen Shake Camera Context Offset
    ctx.save();
    if (screenShake > 0) {
        ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
        screenShake *= 0.85;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Dynamic Arena Floor
    ctx.fillStyle = '#181a24';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y); ctx.lineTo(canvas.width, GROUND_Y);
    ctx.stroke();

    // Update Player
    let primaryTarget = enemies[0];
    player.update(primaryTarget);
    player.draw();

    // Update Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].update(player);
        enemies[i].draw();
        if (enemies[i].hp <= 0) {
            enemies.splice(i, 1);
        }
    }

    // Process Wave Progression
    if (enemies.length === 0) {
        wave++;
        if (wave > 3) {
            gameRunning = false;
            document.getElementById('title').innerText = "VICTORY!";
            document.getElementById('subtitle').innerText = "You conquered the arena!";
            document.getElementById('overlay').style.display = 'flex';
            ctx.restore();
            return;
        } else {
            spawnWave();
        }
    }

    // Process Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    ctx.restore();
    updateHUD();

    if (player.hp <= 0) {
        gameRunning = false;
        document.getElementById('title').innerText = "DEFEATED";
        document.getElementById('subtitle').innerText = "Try again to defeat the Warlord.";
        document.getElementById('overlay').style.display = 'flex';
        return;
    }

    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
