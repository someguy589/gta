<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Cookie Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1e1b18;
            color: #f5e8d0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* LEFT PANEL: Cookie & Stats */
        .left-panel {
            flex: 1.2;
            background: radial-gradient(circle, #3d2c1d 0%, #1a120b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 4px solid #4a3525;
            position: relative;
            padding: 20px;
        }

        .stats-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .cookie-count {
            font-size: 42px;
            font-weight: 900;
            color: #f7ba36;
            text-shadow: 0 0 10px rgba(247, 186, 54, 0.4);
        }

        .cps-count {
            font-size: 18px;
            color: #c4b098;
            margin-top: 5px;
        }

        .cookie-wrapper {
            position: relative;
            cursor: pointer;
        }

        .big-cookie {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, #d98e32 0%, #a15e18 100%);
            border-radius: 50%;
            border: 8px solid #75410c;
            box-shadow: 0 0 30px rgba(0,0,0,0.6), inset -10px -10px 20px rgba(0,0,0,0.4);
            position: relative;
            transition: transform 0.05s ease;
        }

        .big-cookie:active {
            transform: scale(0.93);
        }

        /* Chocolate Chips */
        .chip {
            position: absolute;
            background: #3d2105;
            border-radius: 50%;
        }

        /* Floating +1 Text Effects */
        .floating-text {
            position: absolute;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }

        /* RIGHT PANEL: Store & Upgrades */
        .right-panel {
            flex: 1;
            background: #26201a;
            display: flex;
            flex-direction: column;
            border-left: 2px solid #3a3027;
        }

        .store-header {
            background: #181410;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #f7ba36;
            border-bottom: 2px solid #3a3027;
        }

        .store-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .store-item {
            background: #332b23;
            border: 2px solid #4a3e33;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, opacity 0.2s;
        }

        .store-item:hover:not(.disabled) {
            background: #42382e;
            border-color: #f7ba36;
        }

        .store-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .item-info h4 {
            font-size: 16px;
            color: #fff;
        }

        .item-info p {
            font-size: 12px;
            color: #b0a090;
            margin-top: 2px;
        }

        .item-cost {
            font-size: 14px;
            font-weight: bold;
            color: #f7ba36;
            margin-top: 4px;
        }

        .item-count {
            font-size: 28px;
            font-weight: bold;
            color: rgba(255,255,255,0.25);
            margin-left: 15px;
        }

        /* Bottom Controls */
        .controls {
            padding: 15px;
            background: #181410;
            display: flex;
            gap: 10px;
            border-top: 2px solid #3a3027;
        }

        .btn {
            flex: 1;
            padding: 10px;
            background: #4a3e33;
            border: 1px solid #665546;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5c4d3f;
        }

        .btn-danger {
            background: #8b2626;
            border-color: #a83232;
        }

        .btn-danger:hover {
            background: #a83232;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a120b; }
        ::-webkit-scrollbar-thumb { background: #4a3e33; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Left side: Big cookie & active stats -->
    <div class="left-panel">
        <div class="stats-container">
            <div class="cookie-count" id="cookie-display">0 cookies</div>
            <div class="cps-count" id="cps-display">per second: 0</div>
        </div>

        <div class="cookie-wrapper" id="cookie-btn">
            <div class="big-cookie" id="cookie-element">
                <!-- Decorative chocolate chips -->
                <div class="chip" style="width: 28px; height: 28px; top: 40px; left: 60px;"></div>
                <div class="chip" style="width: 35px; height: 35px; top: 120px; left: 40px;"></div>
                <div class="chip" style="width: 25px; height: 25px; top: 180px; left: 100px;"></div>
                <div class="chip" style="width: 32px; height: 32px; top: 60px; left: 150px;"></div>
                <div class="chip" style="width: 40px; height: 40px; top: 130px; left: 160px;"></div>
                <div class="chip" style="width: 22px; height: 22px; top: 190px; left: 180px;"></div>
            </div>
        </div>
    </div>

    <!-- Right side: Purchase Upgrades Store -->
    <div class="right-panel">
        <div class="store-header">BUILDINGS & UPGRADES</div>
        <div class="store-list" id="store-container">
            <!-- Items generated dynamically in JS -->
        </div>
        <div class="controls">
            <button class="btn" onclick="saveGame()">Save Game</button>
            <button class="btn btn-danger" onclick="resetGame()">Reset Progress</button>
        </div>
    </div>

    <script>
        // Game State Variables
        let cookies = 0;
        let cookiesPerSecond = 0;
        let cookiesPerClick = 1;

        // Upgrades Store Database
        const upgrades = [
            { id: 'cursor', name: 'Reinforced Cursor', cost: 15, cps: 0.1, clickPower: 1, count: 0, desc: 'Autoclicks once every 10 seconds.' },
            { id: 'grandma', name: 'Grandma', cost: 100, cps: 1, clickPower: 0, count: 0, desc: 'A nice grandma to bake cookies.' },
            { id: 'farm', name: 'Cookie Farm', cost: 1100, cps: 8, clickPower: 0, count: 0, desc: 'Grows cookie plants from cookie seeds.' },
            { id: 'mine', name: 'Cookie Mine', cost: 12000, cps: 47, clickPower: 0, count: 0, desc: 'Mines out chocolate dough ore.' },
            { id: 'factory', name: 'Cookie Factory', cost: 130000, cps: 260, clickPower: 0, count: 0, desc: 'Produces massive quantities of cookies.' },
            { id: 'bank', name: 'Cookie Bank', cost: 1400000, cps: 1400, clickPower: 0, count: 0, desc: 'Generates cookies from interest.' },
            { id: 'temple', name: 'Cookie Temple', cost: 20000000, cps: 7800, clickPower: 0, count: 0, desc: 'Worship the ancient Cookie Gods.' },
            { id: 'shipment', name: 'Alien Shipment', cost: 330000000, cps: 44000, clickPower: 0, count: 0, desc: 'Imports cookies from distant planets.' }
        ];

        // DOM Elements
        const cookieDisplay = document.getElementById('cookie-display');
        const cpsDisplay = document.getElementById('cps-display');
        const cookieBtn = document.getElementById('cookie-btn');
        const storeContainer = document.getElementById('store-container');

        // Click Big Cookie Action
        cookieBtn.addEventListener('click', (e) => {
            cookies += cookiesPerClick;
            createFloatingText(e, `+${formatNumber(cookiesPerClick)}`);
            updateDisplay();
        });

        // Floating Text Animation on Click
        function createFloatingText(event, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;

            // Offset slight randomness
            const rect = cookieBtn.getBoundingClientRect();
            const x = event.clientX - rect.left + (Math.random() * 20 - 10);
            const y = event.clientY - rect.top + (Math.random() * 20 - 10);

            el.style.left = `${x}px`;
            el.style.top = `${y}px`;

            cookieBtn.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 800);
        }

        // Render Upgrade Store
        function renderStore() {
            storeContainer.innerHTML = '';
            upgrades.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `store-item ${cookies < item.cost ? 'disabled' : ''}`;
                div.onclick = () => buyUpgrade(index);

                div.innerHTML = `
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <p>${item.desc}</p>
                        <div class="item-cost">🍪 ${formatNumber(Math.ceil(item.cost))}</div>
                    </div>
                    <div class="item-count">${item.count}</div>
                `;
                storeContainer.appendChild(div);
            });
        }

        // Purchase Logic
        function buyUpgrade(index) {
            const item = upgrades[index];
            if (cookies >= item.cost) {
                cookies -= item.cost;
                item.count++;
                
                // Increase cost exponentially by 15%
                item.cost = Math.ceil(item.cost * 1.15);

                recalculateCPS();
                renderStore();
                updateDisplay();
            }
        }

        // Calculate Cookies Per Second & Click Power
        function recalculateCPS() {
            cookiesPerSecond = 0;
            cookiesPerClick = 1;

            upgrades.forEach(item => {
                cookiesPerSecond += item.count * item.cps;
                cookiesPerClick += item.count * item.clickPower;
            });
        }

        // Helper Number Formatting
        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + ' billion';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + ' million';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'k';
            return Math.floor(num).toLocaleString();
        }

        // Update UI
        function updateDisplay() {
            cookieDisplay.innerText = `${formatNumber(Math.floor(cookies))} ${Math.floor(cookies) === 1 ? 'cookie' : 'cookies'}`;
            cpsDisplay.innerText = `per second: ${formatNumber(cookiesPerSecond.toFixed(1))}`;

            // Refresh store visual states when affordances change
            const storeItems = document.querySelectorAll('.store-item');
            upgrades.forEach((item, i) => {
                if (storeItems[i]) {
                    if (cookies < item.cost) {
                        storeItems[i].classList.add('disabled');
                    } else {
                        storeItems[i].classList.remove('disabled');
                    }
                }
            });
        }

        // Main Game Loop (Runs 10 times per second for smooth updates)
        setInterval(() => {
            if (cookiesPerSecond > 0) {
                cookies += cookiesPerSecond / 10;
                updateDisplay();
            }
        }, 100);

        // Save progress to LocalStorage
        function saveGame() {
            const saveData = {
                cookies: cookies,
                upgrades: upgrades.map(u => ({ id: u.id, count: u.count, cost: u.cost }))
            };
            localStorage.setItem('cookie_clicker_save', JSON.stringify(saveData));
            alert('Game Saved!');
        }

        // Load progress from LocalStorage
        function loadGame() {
            const data = localStorage.getItem('cookie_clicker_save');
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    cookies = parsed.cookies || 0;
                    if (parsed.upgrades) {
                        parsed.upgrades.forEach(savedItem => {
                            const match = upgrades.find(u => u.id === savedItem.id);
                            if (match) {
                                match.count = savedItem.count;
                                match.cost = savedItem.cost;
                            }
                        });
                    }
                } catch (e) {
                    console.error('Could not load save data', e);
                }
            }
            recalculateCPS();
            renderStore();
            updateDisplay();
        }

        // Reset All Progress
        function resetGame() {
            if (confirm('Are you sure you want to reset all your cookies and upgrades?')) {
                localStorage.removeItem('cookie_clicker_save');
                location.reload();
            }
        }

        // Auto Save every 30 seconds
        setInterval(saveGame, 30000);

        // Initialize Game On Load
        loadGame();
    </script>
</body>
</html>
